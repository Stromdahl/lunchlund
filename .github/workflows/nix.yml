name: Nix build

# The only CI. Builds the flake package; its checkPhase runs `yarn test`, so
# tests are covered here too and a red test fails this job. Push only: the
# page itself is built and published on radon (see README).
on:
  push:

permissions:
  contents: read

jobs:
  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Build
        run: nix build -L

      - name: Flake check
        run: nix flake check -L
