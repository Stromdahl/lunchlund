name: Nix build

# Builds the flake package; its checkPhase runs `yarn test`, so a red test
# fails this job. Separate from build.yml so it doesn't inherit that
# workflow's schedule, Pages permissions or concurrency group.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Build
        run: nix build -L

      - name: Flake check
        run: nix flake check -L
