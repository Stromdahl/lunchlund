name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # 03:17 dodges a nightly window (~00:00–02:00 Stockholm) where the
    # one.com-hosted sites returned 503 and the GlobalConnect-hosted ones
    # 415 (Jun 3–5 2026); daytime runs from the same runners were fine.
    # Cause unconfirmed — if failures recur at 03:17, suspect IP-based
    # bot blocking rather than a time window.
    - cron: '17 3 * * 1-5'
      timezone: "Europe/Stockholm"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
