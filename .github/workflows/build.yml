name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # The hosts intermittently bot-block GitHub runner IPs (one.com → 503,
    # GlobalConnect → 415 / content-less 200 challenge) in unpredictable
    # windows — daytime too, not just ~00:00–02:00 Stockholm (observed
    # 2026-06-08: a runner was blocked ~11:17 but fetched all 8 fine ~12:09).
    # So we take two independent shots per weekday rather than trusting one
    # window: 03:17 produces the morning page; 09:47 is a pre-lunch retry that
    # also re-seeds the same-week last-known-good cache. A build that lands in
    # a good window seeds the cache, and the fallback (src/scrape.ts) then
    # carries each site through later bad-window builds. Add more slots if
    # error cards still appear across a whole week.
    - cron: '17 3 * * 1-5'
      timezone: "Europe/Stockholm"
    - cron: '47 9 * * 1-5'
      timezone: "Europe/Stockholm"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
