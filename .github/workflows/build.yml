name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Two shots per weekday. The hosts intermittently bot-block GitHub runner
    # IPs (one.com → 503, GlobalConnect → 415 / content-less 200 challenge) in
    # unpredictable windows, so a build that lands in a good window seeds the
    # same-week last-known-good cache and the fallback (src/scrape.ts) then
    # carries each site through later bad-window builds.
    #
    # IMPORTANT: these cron times are NOT when the build runs. GitHub delays
    # scheduled runs by ~3-4h under queue load (observed 2026-06-09: the 03:17
    # slot fired 07:17 Stockholm = +240 min; the previous 09:47 slot fired
    # 12:49 = +182 min, i.e. after lunch). So the crons are set ~4h before the
    # wanted landing: 03:17 → ~07:17 (morning page); 06:17 → ~09:30–10:30
    # (pre-lunch refresh + cache re-seed). Pull earlier / add slots if the
    # drift grows or error cards persist across a whole week.
    - cron: '17 3 * * 1-5'
      timezone: "Europe/Stockholm"
    - cron: '17 6 * * 1-5'
      timezone: "Europe/Stockholm"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
